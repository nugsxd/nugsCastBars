name: lint

# Runs on every push so the state of the code is visible without taking anybody's
# word for it. luacheck is the same linter the WoW addon community uses.
on:
  push:
  pull_request:

jobs:
  luacheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install luacheck
        run: sudo apt-get update && sudo apt-get install -y lua-check
      - name: Run luacheck
        run: luacheck .
